<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEMISTRY QUEST | Vidya Nirman</title><meta name="description" content="Free interactive Class 9 Chemistry Arena quiz from Vidya Nirman."><script src="https://cdn.tailwindcss.com"></script><style>body{background:radial-gradient(ellipse at top,#4a101a 0,#180308 50%,#090205 100%);color:#f8f3e8;font-family:Inter,system-ui,sans-serif}.gold{color:#f6d36b}.card{background:linear-gradient(145deg,rgba(74,13,25,.95),rgba(25,4,9,.98));border:1px solid rgba(246,211,107,.28);box-shadow:0 18px 55px #0006}.choice{border:1px solid #6c3c3d;background:#26070e;transition:.15s}.choice:hover{border-color:#f6d36b;background:#40101b}.choice:focus{outline:2px solid #f6d36b}.correct{border-color:#34d399!important;background:#064e3b!important}.wrong{border-color:#fb7185!important;background:#4c0519!important}</style></head><body class="min-h-screen"><header class="border-b border-amber-400/20 bg-black/20"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between gap-3"><a href="index.html" class="flex items-center gap-3"><img src="logo.png" class="w-10 h-10 rounded-full object-cover" alt="Vidya Nirman logo"><span><b class="gold tracking-widest">VIDYA NIRMAN</b><small class="block text-amber-100/60">Learn • Practice • Achieve</small></span></a><a href="index.html" class="text-sm text-amber-200 hover:text-white">← Home</a></div></header><main class="max-w-3xl mx-auto px-4 py-10"><section class="text-center mb-8"><div class="text-5xl mb-4">🧪</div><p class="uppercase tracking-[.25em] text-xs gold font-bold">Chemistry Arena</p><h1 class="text-3xl sm:text-5xl font-black mt-3">CHEMISTRY QUEST</h1><p class="text-amber-100/70 mt-3">Atoms • Molecules • Matter · Class 9 practice · 50-question challenge</p></section><section class="card rounded-3xl p-5 sm:p-8"><div class="flex items-center justify-between gap-3 text-sm mb-3"><span id="progressLabel" class="gold font-bold">Question 1 of 50</span><span id="scoreLabel" class="text-amber-100/70">Score: 0</span></div><div class="w-full h-2 rounded-full bg-black/50 mb-7 overflow-hidden"><div id="progressBar" class="h-full bg-amber-300 rounded-full" style="width:0%"></div></div><div id="quizArea"><h2 id="questionText" class="text-xl sm:text-2xl font-bold leading-relaxed mb-6"></h2><div id="options" class="grid gap-3"></div><p id="feedback" class="mt-4 min-h-6 text-sm" aria-live="polite"></p><button id="nextBtn" class="mt-5 w-full rounded-xl bg-amber-300 text-stone-950 font-extrabold py-3 px-5 disabled:opacity-40" disabled>Check answer first</button></div><div id="resultArea" class="hidden text-center py-6"><div class="text-5xl mb-4">🏅</div><h2 class="text-3xl font-black gold">Quest Complete!</h2><p id="resultScore" class="text-xl mt-4"></p><p id="resultMessage" class="text-amber-100/70 mt-2"></p><button id="restartBtn" class="mt-7 rounded-xl bg-amber-300 text-stone-950 font-extrabold py-3 px-7">Play Again</button><a href="index.html" class="block mt-4 text-amber-200 underline">Back to Vidya Nirman</a></div></section><p class="text-center text-xs text-amber-100/45 mt-6">Practice quiz for learning. Review explanations after each answer.</p></main><script>
const questions=[["Which is a pure substance?",["Air","Brass","Distilled water","Soil"],2,"Distilled water is a pure compound, unlike mixtures such as air or soil."],["A mixture with uniform composition throughout is:",["Heterogeneous","Homogeneous","Always a suspension","Always an emulsion"],1,"A homogeneous mixture has uniform composition at the scale considered."],["Which method separates different coloured dyes in ink?",["Filtration","Chromatography","Sublimation","Separating funnel"],1,"Chromatography separates components by different movement through a medium."],["Which method is suitable for separating sand from water?",["Filtration","Distillation only","Chromatography","Magnetic separation"],0,"Insoluble sand is retained by a filter."],["Salt can be obtained from salt solution by:",["Evaporation/crystallisation","Magnetic separation","Sublimation of salt","Decanting oil"],0,"Removing solvent allows dissolved salt to crystallise."],["Which method separates miscible liquids with sufficiently different boiling points?",["Simple distillation","Filtration","Handpicking","Sieving"],0,"Distillation uses differences in boiling point and vaporisation."],["Which is a colloid?",["Salt dissolved in water","Milk","Pure copper","Sand in water after settling"],1,"Milk is an emulsion colloid with dispersed fat droplets."],["The Tyndall effect is scattering of light by:",["True solutions only","Colloidal particles","Pure metals only","Vacuum"],1,"Colloidal particles scatter a beam of light."],["Which change is physical?",["Rusting iron","Burning paper","Melting ice","Digestion of food"],2,"Melting changes state but not the chemical identity of water."],["Which change is chemical?",["Breaking glass","Dissolving sugar","Rusting iron","Freezing water"],2,"Rusting forms new iron compounds."],["The SI unit of temperature is:",["Celsius","Kelvin","Fahrenheit","Joule"],1,"Kelvin is the SI base unit for thermodynamic temperature."],["Particles of matter are in constant motion, supported by:",["Diffusion","Only freezing","No observations","Mass conservation alone"],0,"Diffusion demonstrates the random motion of particles."],["Evaporation causes cooling because:",["Lowest-energy particles escape","Highest-energy particles escape from the surface","All particles stop moving","Heat is created from nothing"],1,"Higher-energy particles escape, lowering the average energy of those left."],["Which factor generally increases evaporation?",["Higher humidity","Larger surface area","Lower temperature","Still air always"],1,"A larger surface area allows more particles to escape."],["Latent heat is energy absorbed or released during:",["A temperature change only","A change of state without temperature change","Acceleration","Chemical symbol writing"],1,"Latent heat changes state while temperature remains constant."],["Which state of matter has high compressibility?",["Solid","Liquid","Gas","Crystal only"],2,"Gas particles are far apart and can be compressed significantly."],["The smallest particle of an element that retains its chemical identity is an:",["Atom","Mixture","Solution","Tissue"],0,"An atom is the smallest unit of an element that participates in chemical reactions."],["The law of conservation of mass states that in a chemical reaction:",["Mass is created","Mass is destroyed","Total mass remains constant in a closed system","Only gas has mass"],2,"Atoms are rearranged; total mass is conserved."],["The law of constant proportions means a compound always contains elements:",["In any ratio","In a fixed proportion by mass","Only in equal volumes","Without atoms"],1,"A pure compound has a fixed composition by mass."],["Who proposed the atomic theory in modern chemistry?",["John Dalton","J. J. Thomson","Rutherford","Bohr"],0,"Dalton developed the modern atomic theory in the early nineteenth century."],["The charge on a proton is:",["Negative","Positive","Zero","Variable in ordinary atoms"],1,"A proton carries +1 elementary charge."],["Which subatomic particle has no electric charge?",["Proton","Electron","Neutron","Positron"],2,"Neutrons are electrically neutral."],["Atomic number equals the number of:",["Neutrons","Protons","Protons plus neutrons","Electron shells"],1,"Atomic number is defined by proton count."],["Mass number equals:",["Protons only","Neutrons only","Protons plus neutrons","Electrons plus shells"],2,"Mass number is the total number of nucleons."],["Isotopes of an element have the same:",["Mass number","Neutron number","Atomic number","Number of nucleons"],2,"Isotopes share proton number but differ in neutron number."],["The electronic configuration of sodium (atomic number 11) is:",["2,8,1","2,7,2","2,8,2","2,6,3"],0,"Eleven electrons fill shells as 2, 8, 1 in the basic shell model."],["The valency of magnesium (atomic number 12) is usually:",["1","2","6","8"],1,"Magnesium loses two outer-shell electrons to form Mg²⁺."],["Which formula represents magnesium chloride?",["MgCl","MgCl₂","Mg₂Cl","Mg₂Cl₃"],1,"Mg²⁺ balances two Cl⁻ ions, giving MgCl₂."],["The chemical formula of aluminium oxide is:",["AlO","Al₂O","AlO₂","Al₂O₃"],3,"Two Al³⁺ ions balance three O²⁻ ions."],["One mole contains approximately:",["6.022×10²³ entities","6.022×10² entities","3.0×10⁸ atoms always","100 entities"],0,"Avogadro’s constant is about 6.022×10²³ mol⁻¹."],["The molecular mass of H₂O is approximately:",["10 u","16 u","18 u","20 u"],2,"2×1 u + 16 u = 18 u."],["The molecular mass of CO₂ is approximately:",["28 u","32 u","40 u","44 u"],3,"12 u + 2×16 u = 44 u."],["Which is a diatomic molecule of an element?",["He","O₂","H₂O","CO₂"],1,"Oxygen commonly exists as O₂ molecules."],["Which is a compound rather than an element?",["O₂","N₂","S₈","NH₃"],3,"Ammonia contains nitrogen and hydrogen chemically combined."],["A positively charged ion is called a:",["Anion","Cation","Isotope","Isobar"],1,"A cation forms when an atom or group loses electrons."],["A negatively charged ion is called an:",["Anion","Cation","Nucleon","Isotope"],0,"An anion forms when electrons are gained."],["Which particle determines the identity of an element?",["Neutron","Proton","Outer shell only","Molecule count"],1,"Changing proton number changes the element."],["Which separation method uses a separating funnel?",["Immiscible liquids","Dissolved salt from water","Dyes in ink","Fine sand from water"],0,"Immiscible liquids form separate layers according to density."],["Which process can separate ammonium chloride from sand?",["Sublimation","Filtration only","Sedimentation","Magnetic separation"],0,"Ammonium chloride sublimes on heating while sand does not."],["Centrifugation separates components mainly by differences in:",["Density under spinning","Colour alone","Chemical formula spelling","Magnetic poles only"],0,"Centrifugal action speeds separation based on density and particle size."],["A saturated solution at a given temperature:",["Can dissolve unlimited solute","Contains the maximum dissolved solute at equilibrium","Contains no solute","Must be a gas"],1,"Saturation is defined at a given temperature and pressure."],["Solubility of many solid solutes in water generally increases when:",["Temperature rises","Temperature is always zero","Pressure alone rises greatly","Water is removed completely"],0,"For many solids, higher temperature increases solubility, though exceptions exist."],["Which element symbol is correctly written?",["co for cobalt","CL for chlorine","Na for sodium","MG for magnesium"],2,"Element symbols use one capital letter and, if needed, a lowercase second letter."],["Which is a correct chemical equation for hydrogen reacting with oxygen to form water?",["H₂ + O₂ → H₂O","2H₂ + O₂ → 2H₂O","H + O → H₂O₂","H₂ + 2O₂ → H₂O"],1,"Balancing gives four H atoms and two O atoms on both sides."],["Why must chemical equations be balanced?",["To change products","To conserve atoms and mass","To increase reaction speed","To remove coefficients"],1,"The same number of each type of atom must appear on both sides."],["Which is an example of a solution?",["Mud in water","Sugar dissolved uniformly in water","Oil and water layers","Chalk powder in water"],1,"Dissolved sugar forms a homogeneous mixture."],["Which mixture can settle on standing and be separated by decantation?",["A true salt solution","Sand in water","Pure air","Copper metal"],1,"Suspended sand settles, allowing the liquid to be poured off."],["Which subatomic particle has the smallest mass among the three basic particles?",["Proton","Neutron","Electron","All have equal mass"],2,"An electron has far less mass than a proton or neutron."],["Which pair represents isotopes?",["¹²C and ¹⁴C","¹⁴N and ¹⁴C","Na and Mg","O₂ and O₃"],0,"Carbon-12 and carbon-14 have six protons but different neutron counts."],["Application check 50: Which statement about Cell membrane is scientifically correct?",["It selectively controls movement of substances","It always creates new elements","It violates conservation laws","It applies only in a vacuum"],0,"Cell membrane: Selectively controls movement of substances. The other statements are not generally correct."]]; let idx=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;const q=questions[idx];$('progressLabel').textContent=`Question ${idx+1} of ${questions.length}`;$('scoreLabel').textContent=`Score: ${score}`;$('progressBar').style.width=`${idx/questions.length*100}%`;$('questionText').textContent=q[0];$('options').innerHTML='';$('feedback').textContent='';$('nextBtn').disabled=true;$('nextBtn').textContent=idx===questions.length-1?'See results →':'Next question →';q[1].forEach((option,i)=>{const b=document.createElement('button');b.className='choice text-left rounded-xl px-4 py-3 font-semibold';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>choose(i,b);$('options').appendChild(b)})}
function choose(i,btn){if(answered)return;answered=true;const q=questions[idx];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===i&&i!==q[2])b.classList.add('wrong')});if(i===q[2]){score++;$('feedback').innerHTML='<span class="text-emerald-300 font-bold">Correct! </span>'+q[3]}else{$('feedback').innerHTML='<span class="text-rose-300 font-bold">Not quite. </span>'+q[3]}$('scoreLabel').textContent=`Score: ${score}`;$('nextBtn').disabled=false;$('nextBtn').textContent=idx===questions.length-1?'See results →':'Next question →'}
$('nextBtn').onclick=()=>{if(!answered)return;idx++;if(idx<questions.length)render();else finish()};
function finish(){$('quizArea').classList.add('hidden');$('resultArea').classList.remove('hidden');$('progressBar').style.width='100%';$('progressLabel').textContent='Completed';$('resultScore').textContent=`You scored ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;$('resultMessage').textContent=score===questions.length?'Perfect score! Outstanding work.':score>=questions.length*.7?'Great work! Review the explanations and try for a perfect score.':'Good effort! Review the explanations and replay to strengthen your knowledge.'}
$('restartBtn').onclick=()=>{idx=0;score=0;$('quizArea').classList.remove('hidden');$('resultArea').classList.add('hidden');render()};render();
</script></body></html>
