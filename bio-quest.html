<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO QUEST | Vidya Nirman</title><meta name="description" content="Free interactive Class 9 Biology Arena quiz from Vidya Nirman."><script src="https://cdn.tailwindcss.com"></script><style>body{background:radial-gradient(ellipse at top,#4a101a 0,#180308 50%,#090205 100%);color:#f8f3e8;font-family:Inter,system-ui,sans-serif}.gold{color:#f6d36b}.card{background:linear-gradient(145deg,rgba(74,13,25,.95),rgba(25,4,9,.98));border:1px solid rgba(246,211,107,.28);box-shadow:0 18px 55px #0006}.choice{border:1px solid #6c3c3d;background:#26070e;transition:.15s}.choice:hover{border-color:#f6d36b;background:#40101b}.choice:focus{outline:2px solid #f6d36b}.correct{border-color:#34d399!important;background:#064e3b!important}.wrong{border-color:#fb7185!important;background:#4c0519!important}</style></head><body class="min-h-screen"><header class="border-b border-amber-400/20 bg-black/20"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between gap-3"><a href="index.html" class="flex items-center gap-3"><img src="logo.png" class="w-10 h-10 rounded-full object-cover" alt="Vidya Nirman logo"><span><b class="gold tracking-widest">VIDYA NIRMAN</b><small class="block text-amber-100/60">Learn • Practice • Achieve</small></span></a><a href="index.html" class="text-sm text-amber-200 hover:text-white">← Home</a></div></header><main class="max-w-3xl mx-auto px-4 py-10"><section class="text-center mb-8"><div class="text-5xl mb-4">🧬</div><p class="uppercase tracking-[.25em] text-xs gold font-bold">Biology Arena</p><h1 class="text-3xl sm:text-5xl font-black mt-3">BIO QUEST</h1><p class="text-amber-100/70 mt-3">Cells • Tissues • Life Processes · Class 9 practice · 50-question challenge</p></section><section class="card rounded-3xl p-5 sm:p-8"><div class="flex items-center justify-between gap-3 text-sm mb-3"><span id="progressLabel" class="gold font-bold">Question 1 of 50</span><span id="scoreLabel" class="text-amber-100/70">Score: 0</span></div><div class="w-full h-2 rounded-full bg-black/50 mb-7 overflow-hidden"><div id="progressBar" class="h-full bg-amber-300 rounded-full" style="width:0%"></div></div><div id="quizArea"><h2 id="questionText" class="text-xl sm:text-2xl font-bold leading-relaxed mb-6"></h2><div id="options" class="grid gap-3"></div><p id="feedback" class="mt-4 min-h-6 text-sm" aria-live="polite"></p><button id="nextBtn" class="mt-5 w-full rounded-xl bg-amber-300 text-stone-950 font-extrabold py-3 px-5 disabled:opacity-40" disabled>Check answer first</button></div><div id="resultArea" class="hidden text-center py-6"><div class="text-5xl mb-4">🏅</div><h2 class="text-3xl font-black gold">Quest Complete!</h2><p id="resultScore" class="text-xl mt-4"></p><p id="resultMessage" class="text-amber-100/70 mt-2"></p><button id="restartBtn" class="mt-7 rounded-xl bg-amber-300 text-stone-950 font-extrabold py-3 px-7">Play Again</button><a href="index.html" class="block mt-4 text-amber-200 underline">Back to Vidya Nirman</a></div></section><p class="text-center text-xs text-amber-100/45 mt-6">Practice quiz for learning. Review explanations after each answer.</p></main><script>
const questions=[["Which feature is common to all cells?",["A membrane enclosing cell contents","A cell wall made of cellulose","Chloroplasts","A large central vacuole"],0,"Every cell has a plasma membrane; the other structures are not universal."],["Which structure is the site of protein synthesis?",["Lysosome","Ribosome","Vacuole","Centrosome"],1,"Ribosomes assemble amino acids into proteins."],["A plant cell placed in a concentrated salt solution shrinks away from its wall. This is:",["Diffusion","Plasmolysis","Osmosis into the cell","Active transport"],1,"Water leaves the cell by osmosis and the protoplast pulls away from the wall."],["Which statement best describes osmosis?",["Movement of solute from low to high concentration","Movement of water through a selectively permeable membrane","Movement of particles using ATP only","Movement of gases against a gradient"],1,"Osmosis is net water movement across a selectively permeable membrane."],["Which organelle packages and modifies materials for secretion?",["Golgi apparatus","Nucleolus","Chloroplast","Centromere"],0,"The Golgi apparatus modifies, sorts and packages products."],["Which cell structure contains most hereditary material in a typical eukaryotic cell?",["Nucleus","Cell wall","Vacuole","Golgi body"],0,"Most eukaryotic DNA is housed in the nucleus."],["Why do plant cells usually not burst in pure water?",["Their nucleus pumps water out","The rigid cell wall resists expansion","They lack a membrane","Water cannot enter plant cells"],1,"The cell wall counteracts the internal pressure from water uptake."],["Which organelle helps break down worn-out cell components?",["Lysosome","Ribosome","Chloroplast","Nucleolus"],0,"Lysosomal enzymes digest waste and damaged components."],["Which pair is correctly matched?",["Xylem—food transport","Phloem—water transport","Xylem—water and minerals","Epidermis—nerve impulses"],2,"Xylem conducts water and dissolved minerals."],["Which plant tissue consists of actively dividing cells?",["Sclerenchyma","Meristematic tissue","Cork","Xylem vessels"],1,"Meristematic tissue produces new cells through mitosis."],["Which meristem mainly increases the length of a root?",["Lateral meristem","Apical meristem","Cork cambium only","Intercalary meristem in stem only"],1,"Apical meristems at root and shoot tips enable primary growth."],["The main function of stomata is to regulate:",["Seed formation","Gas exchange and water loss","Mineral production","Root anchorage"],1,"Guard cells regulate pore opening for gas exchange and transpiration."],["Which tissue provides flexibility in young stems?",["Collenchyma","Sclerenchyma fibres","Xylem vessels","Cork"],0,"Collenchyma has unevenly thickened walls and supports flexible growth."],["Which tissue gives hardness to coconut husk?",["Parenchyma","Collenchyma","Sclerenchyma","Phloem"],2,"Sclerenchyma cells have thick, lignified walls."],["Which is a simple permanent plant tissue?",["Xylem","Phloem","Parenchyma","Meristem"],2,"Parenchyma is a simple permanent tissue."],["Which component of blood transports oxygen using haemoglobin?",["Platelets","Red blood cells","White blood cells","Plasma proteins only"],1,"Haemoglobin in red blood cells binds oxygen."],["Which blood component is most directly involved in clot formation?",["Platelets","Neurons","Alveoli","Bile salts"],0,"Platelets help initiate blood clotting."],["Which animal tissue transmits electrical impulses?",["Epithelial","Connective","Nervous","Muscular only"],2,"Neurons conduct nerve impulses."],["Tendon connects:",["Bone to bone","Muscle to bone","Nerve to muscle only","Skin to epidermis"],1,"Tendons attach muscles to bones."],["Ligaments mainly connect:",["Muscle to bone","Bone to bone","Blood to tissue","Neuron to neuron"],1,"Ligaments stabilize joints by joining bones."],["Which muscle type is involuntary and striated?",["Smooth muscle","Skeletal muscle","Cardiac muscle","All epithelial tissue"],2,"Cardiac muscle is striated and works involuntarily."],["Which epithelial tissue is suited to diffusion in alveoli?",["Stratified squamous","Simple squamous","Cuboidal","Ciliated columnar"],1,"A thin simple squamous layer enables rapid gas diffusion."],["Ciliated epithelium in the respiratory tract helps:",["Absorb sunlight","Move mucus and trapped particles","Make red blood cells","Store fat"],1,"Cilia move mucus toward the throat."],["Amoeba engulfs food using:",["Pseudopodia","Hyphae","Root hairs","Cilia only"],0,"Pseudopodia surround food during phagocytosis."],["Which scientist first described cells in cork in 1665?",["Robert Hooke","Rudolf Virchow","Louis Pasteur","Watson"],0,"Hooke observed box-like compartments in cork."],["Who proposed that new cells arise from existing cells?",["Schleiden alone","Rudolf Virchow","Robert Brown","Darwin"],1,"Virchow popularized the principle that cells come from pre-existing cells."],["Which structure is present in plant cells but absent in animal cells?",["Cell membrane","Cytoplasm","Cellulose cell wall","Mitochondria"],2,"Plant cells have a cellulose cell wall; animal cells do not."],["Which organelle converts light energy into chemical energy?",["Mitochondrion","Chloroplast","Lysosome","Golgi apparatus"],1,"Chlorophyll in chloroplasts captures light for photosynthesis."],["The fluid-like material between the cell membrane and nucleus is:",["Cytoplasm","Chromatin only","Cellulose","Lumen"],0,"Cytoplasm contains organelles suspended in cytosol."],["Which structure controls movement of substances into and out of a cell?",["Cell membrane","Nucleolus","Chromosome","Cell plate"],0,"The plasma membrane is selectively permeable."],["Which cell is generally adapted for rapid water absorption in roots?",["Root hair cell","Guard cell","Sieve plate","Red blood cell"],0,"Root hairs provide a large surface area for water uptake."],["Transpiration is the loss of water vapour mainly from:",["Leaves through stomata","Roots into soil","Seeds through cotyledons only","Xylem into phloem"],0,"Most transpiration occurs through leaf stomata."],["Which process moves particles from higher to lower concentration without cellular energy?",["Diffusion","Active transport","Endocytosis","Protein synthesis"],0,"Diffusion is passive net movement down a concentration gradient."],["Which tissue transports sugars from leaves to other plant parts?",["Xylem","Phloem","Cork","Apical meristem"],1,"Phloem translocates sugars and other organic solutes."],["Which statement about xylem is correct?",["It transports only sugars","It includes vessels and tracheids in many plants","It is made only of living sieve tubes","It carries nerve impulses"],1,"Xylem commonly includes vessels, tracheids, fibres and parenchyma."],["Which cells are usually dead at maturity and provide mechanical support?",["Sclerenchyma fibres","Parenchyma","Guard cells","Companion cells"],0,"Sclerenchyma fibres are typically dead with thick lignified walls."],["Which tissue stores food in many plant organs?",["Parenchyma","Nervous tissue","Cardiac muscle","Xylem vessels only"],0,"Parenchyma often stores starch and other materials."],["Which tissue forms the protective outer covering of young plant parts?",["Epidermis","Phloem","Cambium","Pith only"],0,"The epidermis protects plant surfaces and can reduce water loss."],["Which part of a neuron usually receives signals?",["Dendrites","Axon terminal only","Myelin only","Nucleus outside cell"],0,"Dendrites receive signals from other cells."],["Which connective tissue stores fat?",["Adipose tissue","Cartilage","Blood plasma","Tendon"],0,"Adipose tissue stores lipids and helps insulate the body."],["Cartilage is found in the:",["Tip of the nose","Wall of the xylem","Leaf stomatal pore","Neuron nucleus"],0,"Cartilage supports flexible structures such as the nose and ear."],["Which muscle type lines many internal organs?",["Smooth muscle","Skeletal muscle","Cardiac muscle","Striated voluntary muscle only"],0,"Smooth muscle moves contents through organs involuntarily."],["Why are mitochondria abundant in cells with high energy demand?",["They store genetic information only","They generate ATP during respiration","They manufacture cellulose","They digest all extracellular food"],1,"Mitochondria produce much of the ATP used by eukaryotic cells."],["Which organelle assembles ribosomal subunits?",["Nucleolus","Lysosome","Vacuole","Cell wall"],0,"The nucleolus produces rRNA and assembles ribosomal subunits."],["What is the main role of the large central vacuole in many plant cells?",["Maintain turgor and store substances","Carry oxygen in blood","Produce ribosomes","Conduct impulses"],0,"The vacuole stores cell sap and helps maintain turgor pressure."],["Which statement distinguishes prokaryotic cells?",["They lack a membrane-bound nucleus","They always have chloroplasts","They have no DNA","They are always multicellular"],0,"Prokaryotes have DNA but no membrane-bound nucleus."],["Which structure forms the spindle during cell division in animal cells?",["Centrosome/centrioles","Cell wall","Large vacuole","Golgi cisternae only"],0,"Centrosomes help organize microtubules in animal-cell division."],["A tissue is best defined as:",["A group of similar cells performing a function","A single organelle","A group of unrelated organs","Only dead cells"],0,"Tissues are organized groups of cells working together."],["Which plant tissue increases stem girth?",["Lateral meristem/cambium","Apical meristem only","Epidermis","Phloem fibres only"],0,"Lateral meristems add secondary tissues and increase thickness."],["Which process explains water moving from dilute solution into a concentrated cell sap?",["Osmosis","Evaporation only","Respiration","Translocation"],0,"Water moves across a selectively permeable membrane by osmosis."]]; let idx=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;const q=questions[idx];$('progressLabel').textContent=`Question ${idx+1} of ${questions.length}`;$('scoreLabel').textContent=`Score: ${score}`;$('progressBar').style.width=`${idx/questions.length*100}%`;$('questionText').textContent=q[0];$('options').innerHTML='';$('feedback').textContent='';$('nextBtn').disabled=true;$('nextBtn').textContent=idx===questions.length-1?'See results →':'Next question →';q[1].forEach((option,i)=>{const b=document.createElement('button');b.className='choice text-left rounded-xl px-4 py-3 font-semibold';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>choose(i,b);$('options').appendChild(b)})}
function choose(i,btn){if(answered)return;answered=true;const q=questions[idx];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===i&&i!==q[2])b.classList.add('wrong')});if(i===q[2]){score++;$('feedback').innerHTML='<span class="text-emerald-300 font-bold">Correct! </span>'+q[3]}else{$('feedback').innerHTML='<span class="text-rose-300 font-bold">Not quite. </span>'+q[3]}$('scoreLabel').textContent=`Score: ${score}`;$('nextBtn').disabled=false;$('nextBtn').textContent=idx===questions.length-1?'See results →':'Next question →'}
$('nextBtn').onclick=()=>{if(!answered)return;idx++;if(idx<questions.length)render();else finish()};
function finish(){$('quizArea').classList.add('hidden');$('resultArea').classList.remove('hidden');$('progressBar').style.width='100%';$('progressLabel').textContent='Completed';$('resultScore').textContent=`You scored ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;$('resultMessage').textContent=score===questions.length?'Perfect score! Outstanding work.':score>=questions.length*.7?'Great work! Review the explanations and try for a perfect score.':'Good effort! Review the explanations and replay to strengthen your knowledge.'}
$('restartBtn').onclick=()=>{idx=0;score=0;$('quizArea').classList.remove('hidden');$('resultArea').classList.add('hidden');render()};render();
</script></body></html>
