<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHYSICS QUEST | Vidya Nirman</title><meta name="description" content="Free interactive Class 9 Physics Arena quiz from Vidya Nirman."><script src="https://cdn.tailwindcss.com"></script><style>body{background:radial-gradient(ellipse at top,#4a101a 0,#180308 50%,#090205 100%);color:#f8f3e8;font-family:Inter,system-ui,sans-serif}.gold{color:#f6d36b}.card{background:linear-gradient(145deg,rgba(74,13,25,.95),rgba(25,4,9,.98));border:1px solid rgba(246,211,107,.28);box-shadow:0 18px 55px #0006}.choice{border:1px solid #6c3c3d;background:#26070e;transition:.15s}.choice:hover{border-color:#f6d36b;background:#40101b}.choice:focus{outline:2px solid #f6d36b}.correct{border-color:#34d399!important;background:#064e3b!important}.wrong{border-color:#fb7185!important;background:#4c0519!important}</style></head><body class="min-h-screen"><header class="border-b border-amber-400/20 bg-black/20"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between gap-3"><a href="index.html" class="flex items-center gap-3"><img src="logo.png" class="w-10 h-10 rounded-full object-cover" alt="Vidya Nirman logo"><span><b class="gold tracking-widest">VIDYA NIRMAN</b><small class="block text-amber-100/60">Learn • Practice • Achieve</small></span></a><a href="index.html" class="text-sm text-amber-200 hover:text-white">← Home</a></div></header><main class="max-w-3xl mx-auto px-4 py-10"><section class="text-center mb-8"><div class="text-5xl mb-4">⚡</div><p class="uppercase tracking-[.25em] text-xs gold font-bold">Physics Arena</p><h1 class="text-3xl sm:text-5xl font-black mt-3">PHYSICS QUEST</h1><p class="text-amber-100/70 mt-3">Motion • Force • Work & Energy · Class 9 practice · 50-question challenge</p></section><section class="card rounded-3xl p-5 sm:p-8"><div class="flex items-center justify-between gap-3 text-sm mb-3"><span id="progressLabel" class="gold font-bold">Question 1 of 50</span><span id="scoreLabel" class="text-amber-100/70">Score: 0</span></div><div class="w-full h-2 rounded-full bg-black/50 mb-7 overflow-hidden"><div id="progressBar" class="h-full bg-amber-300 rounded-full" style="width:0%"></div></div><div id="quizArea"><h2 id="questionText" class="text-xl sm:text-2xl font-bold leading-relaxed mb-6"></h2><div id="options" class="grid gap-3"></div><p id="feedback" class="mt-4 min-h-6 text-sm" aria-live="polite"></p><button id="nextBtn" class="mt-5 w-full rounded-xl bg-amber-300 text-stone-950 font-extrabold py-3 px-5 disabled:opacity-40" disabled>Check answer first</button></div><div id="resultArea" class="hidden text-center py-6"><div class="text-5xl mb-4">🏅</div><h2 class="text-3xl font-black gold">Quest Complete!</h2><p id="resultScore" class="text-xl mt-4"></p><p id="resultMessage" class="text-amber-100/70 mt-2"></p><button id="restartBtn" class="mt-7 rounded-xl bg-amber-300 text-stone-950 font-extrabold py-3 px-7">Play Again</button><a href="index.html" class="block mt-4 text-amber-200 underline">Back to Vidya Nirman</a></div></section><p class="text-center text-xs text-amber-100/45 mt-6">Practice quiz for learning. Review explanations after each answer.</p></main><script>
const questions=[["A car travels 150 m in 10 s. Its average speed is:",["10 m/s","15 m/s","25 m/s","1500 m/s"],1,"Average speed = distance/time = 150/10 = 15 m/s."],["Which quantity includes both magnitude and direction?",["Distance","Speed","Displacement","Time"],2,"Displacement is a vector quantity."],["A runner completes one lap and returns to the start. The displacement is:",["Equal to the track length","Zero","Half the track length","Always negative"],1,"Initial and final positions are identical, so displacement is zero."],["The slope of a distance–time graph represents:",["Acceleration","Speed","Force","Momentum"],1,"Distance–time graph slope gives speed."],["The slope of a velocity–time graph represents:",["Acceleration","Distance","Mass","Power"],0,"Change in velocity per unit time is acceleration."],["A body starts from rest and accelerates at 2 m/s² for 5 s. Final velocity is:",["2 m/s","5 m/s","10 m/s","25 m/s"],2,"v = u + at = 0 + 2×5 = 10 m/s."],["For uniform acceleration, displacement is calculated by:",["s = ut + ½at²","s = ma","s = F/t","s = v/a²"],0,"The standard kinematic relation is s = ut + ½at²."],["A velocity–time graph is horizontal above the time axis. The body has:",["Uniform positive velocity","Increasing acceleration","Zero velocity","Negative displacement only"],0,"Constant velocity is shown by a horizontal line."],["Which is the SI unit of acceleration?",["m/s","m/s²","km/h","N/kg²"],1,"Acceleration is velocity change per second: m/s²."],["Which statement about inertia is correct?",["It increases when mass increases","It is measured in watts","It makes moving bodies stop by itself","It is a type of energy"],0,"Mass measures inertia; more mass means greater resistance to velocity change."],["A 4 kg object accelerates at 3 m/s². Net force is:",["1.33 N","7 N","12 N","24 N"],2,"F = ma = 4×3 = 12 N."],["Action and reaction forces act on:",["The same object in the same direction","Different objects in opposite directions","Different objects in the same direction","Only stationary objects"],1,"Newton’s third-law forces are equal, opposite and act on different bodies."],["A passenger lurches forward when a bus stops suddenly because of:",["Inertia of motion","Gravitation disappearing","Friction becoming zero","Action-reaction cancellation"],0,"The body tends to maintain its forward motion."],["Momentum is the product of:",["Mass and velocity","Force and time squared","Mass and acceleration","Weight and distance"],0,"Momentum p = mv."],["A 2 kg object moving at 4 m/s has momentum:",["2 kg m/s","6 kg m/s","8 kg m/s","16 kg m/s"],2,"p = mv = 2×4 = 8 kg m/s."],["The SI unit of work is:",["Watt","Joule","Newton","Pascal"],1,"Work is measured in joules."],["When force is perpendicular to displacement, work done by that force is:",["Maximum","Zero","Negative always","Equal to force"],1,"W = Fs cosθ; at 90°, cosθ = 0."],["A 20 N force moves an object 3 m in its direction. Work done is:",["6 J","17 J","23 J","60 J"],3,"W = Fd = 20×3 = 60 J."],["The energy possessed by a moving object is:",["Potential energy","Kinetic energy","Chemical energy only","Nuclear energy only"],1,"Kinetic energy is associated with motion."],["A 2 kg object moves at 3 m/s. Its kinetic energy is:",["3 J","6 J","9 J","18 J"],2,"KE = ½mv² = ½×2×9 = 9 J."],["Gravitational potential energy near Earth is calculated as:",["mgh","mv","½mv²","F/t"],0,"Near Earth’s surface, gravitational PE = mgh."],["If speed doubles, kinetic energy becomes:",["Twice as large","Three times as large","Four times as large","Unchanged"],2,"Kinetic energy depends on the square of speed."],["Power is defined as:",["Work done per unit time","Force per unit area","Momentum per unit mass","Energy multiplied by time"],0,"Power is the rate of doing work."],["A machine does 600 J of work in 20 s. Its power is:",["12 W","30 W","120 W","12000 W"],1,"P = W/t = 600/20 = 30 W."],["The commercial unit of electrical energy is:",["Joule","Kilowatt-hour","Watt","Newton metre per second"],1,"Electrical energy billing commonly uses kWh."],["One kilowatt-hour equals approximately:",["3.6×10³ J","3.6×10⁵ J","3.6×10⁶ J","3.6×10⁹ J"],2,"1000 W × 3600 s = 3.6×10⁶ J."],["Sound is produced by:",["Vibrating objects","Only objects in vacuum","Light rays","Stationary charges only"],0,"Vibrations create disturbances that can propagate as sound."],["Sound cannot travel through:",["Steel","Water","Air","Vacuum"],3,"Sound needs a material medium."],["Frequency is measured in:",["Decibels","Hertz","Metres","Seconds per metre"],1,"Frequency is cycles per second, measured in hertz."],["A sound of higher frequency is perceived as having higher:",["Loudness only","Pitch","Speed in all media","Amplitude only"],1,"Pitch depends primarily on frequency."],["Loudness is related mainly to sound-wave:",["Amplitude","Wavelength only","Frequency only","Speed only"],0,"Greater amplitude is generally perceived as louder sound."],["The speed of sound is generally greatest in:",["Gases","Liquids","Solids","Vacuum"],2,"Particles in solids interact strongly, generally allowing faster sound propagation."],["Echo is heard distinctly when reflected sound arrives after about:",["0.01 s","0.1 s or more","10 minutes","No delay"],1,"A delay around 0.1 s or more helps distinguish an echo."],["Which law explains why a swimmer pushes water backward and moves forward?",["Newton’s third law","Newton’s first law only","Law of conservation of charge","Ohm’s law"],0,"The water exerts an equal and opposite force on the swimmer."],["The weight of an object is:",["Its mass in kilograms","The gravitational force on it","Always equal to its mass numerically","Independent of gravity"],1,"Weight W = mg and depends on gravitational field strength."],["An object’s mass on the Moon compared with Earth is:",["One-sixth","Six times","The same","Zero"],2,"Mass is intrinsic and does not depend on location."],["An object’s weight on the Moon is approximately:",["Equal to Earth weight","Six times Earth weight","One-sixth Earth weight","Zero for every object"],2,"Lunar gravity is roughly one-sixth of Earth’s."],["Pressure is defined as:",["Force × area","Force per unit area","Mass per unit volume","Work per unit time"],1,"Pressure = perpendicular force/area."],["For the same force, reducing contact area makes pressure:",["Decrease","Increase","Stay always zero","Become mass"],1,"Pressure increases as area decreases."],["Buoyant force on an immersed object acts:",["Downward","Upward","Only sideways","Along the current only"],1,"Fluid pressure produces a net upward buoyant force."],["According to Archimedes’ principle, buoyant force equals the weight of:",["The object in air","The displaced fluid","The container","The whole fluid tank"],1,"Buoyant force equals the weight of fluid displaced."],["An object floats when its average density is generally:",["Greater than fluid density","Less than fluid density","Infinite","Unrelated to fluid density"],1,"A floating object displaces enough fluid when its average density is lower than the fluid."],["The universal law of gravitation says attraction depends on:",["Product of masses and inverse square of distance","Sum of masses only","Temperature only","Colour and shape"],0,"F is proportional to m₁m₂/r²."],["If distance between two masses doubles, gravitational force becomes:",["Double","Half","One-fourth","Four times"],2,"Inverse-square dependence gives 1/2² = 1/4."],["A force of 10 N acts for 2 s. The impulse is:",["5 N s","12 N s","20 N s","40 N s"],2,"Impulse = force × time = 10×2 = 20 N s."],["Which situation has zero net force?",["A car speeding up","A falling object with no drag","A book resting on a table","A turning bicycle"],2,"The normal force balances the book’s weight."],["A body moving at constant speed in a straight line has:",["Zero acceleration","Increasing acceleration","Constant nonzero acceleration","Always zero momentum"],0,"Velocity is constant, so acceleration is zero."],["Which is a scalar quantity?",["Force","Displacement","Velocity","Energy"],3,"Energy has magnitude but no direction."],["Which is a vector quantity?",["Distance","Speed","Acceleration","Work"],2,"Acceleration has magnitude and direction."],["A 5 kg body has weight about how much on Earth if g = 9.8 m/s²?",["0.51 N","4.9 N","49 N","98 N"],2,"W = mg = 5×9.8 = 49 N."]]; let idx=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;const q=questions[idx];$('progressLabel').textContent=`Question ${idx+1} of ${questions.length}`;$('scoreLabel').textContent=`Score: ${score}`;$('progressBar').style.width=`${idx/questions.length*100}%`;$('questionText').textContent=q[0];$('options').innerHTML='';$('feedback').textContent='';$('nextBtn').disabled=true;$('nextBtn').textContent=idx===questions.length-1?'See results →':'Next question →';q[1].forEach((option,i)=>{const b=document.createElement('button');b.className='choice text-left rounded-xl px-4 py-3 font-semibold';b.textContent=String.fromCharCode(65+i)+'. '+option;b.onclick=()=>choose(i,b);$('options').appendChild(b)})}
function choose(i,btn){if(answered)return;answered=true;const q=questions[idx];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===i&&i!==q[2])b.classList.add('wrong')});if(i===q[2]){score++;$('feedback').innerHTML='<span class="text-emerald-300 font-bold">Correct! </span>'+q[3]}else{$('feedback').innerHTML='<span class="text-rose-300 font-bold">Not quite. </span>'+q[3]}$('scoreLabel').textContent=`Score: ${score}`;$('nextBtn').disabled=false;$('nextBtn').textContent=idx===questions.length-1?'See results →':'Next question →'}
$('nextBtn').onclick=()=>{if(!answered)return;idx++;if(idx<questions.length)render();else finish()};
function finish(){$('quizArea').classList.add('hidden');$('resultArea').classList.remove('hidden');$('progressBar').style.width='100%';$('progressLabel').textContent='Completed';$('resultScore').textContent=`You scored ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;$('resultMessage').textContent=score===questions.length?'Perfect score! Outstanding work.':score>=questions.length*.7?'Great work! Review the explanations and try for a perfect score.':'Good effort! Review the explanations and replay to strengthen your knowledge.'}
$('restartBtn').onclick=()=>{idx=0;score=0;$('quizArea').classList.remove('hidden');$('resultArea').classList.add('hidden');render()};render();
</script></body></html>
